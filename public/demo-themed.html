<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eagles Widget Demo (Themed)</title>
  </head>
  <body>
    <main style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; padding: 24px; max-width: 860px;">
      <h2 style="margin: 0 0 8px;">Eagles chat widget (demo — same palette, explicit hex)</h2>
      <p style="margin: 0 0 16px; color: #374151;">
        Same as the default brand; values are set explicitly here for reference.
      </p>
      <p style="margin: 0 0 16px; color: #111827;">
        Try asking: <em>"What programs do you offer?"</em>
      </p>
      <ul style="margin: 0; color: #6b7280; font-size: 13px; line-height: 1.5;">
        <li><strong>primary</strong> (navy): #00213D</li>
        <li><strong>accent</strong> (cyan): #63C9D6</li>
        <li><strong>surface</strong>: #ffffff</li>
        <li><strong>text</strong>: #00213D</li>
        <li><strong>muted</strong>: #e8f4f6</li>
      </ul>
    </main>

    <script
      src="/eagles-widget.js"
      data-title="Eagles Assistant"
      data-position="right"
      data-demo="on"
      data-logo="/orlando-eagles-logo.png"
      data-primary="#00213D"
      data-accent="#63C9D6"
      data-surface="#ffffff"
      data-text="#00213D"
      data-muted="#e8f4f6"
      defer
    ></script>
  </body>
</html>
